version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: parkease-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parkease
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - parkease-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parkease-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: parkease-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@parkease.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - parkease-network

volumes:
  parkease-db:
    driver: local

networks:
  parkease-network:
    driver: bridge
